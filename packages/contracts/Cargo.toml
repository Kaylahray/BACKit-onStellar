[workspace]
resolver = "2"
members = [
  "shared",
  "outcome_manager",
  "prediction_market",
  "position_tokens",
  "index_fund",
  "arbitrage",
  "oracle_staking",
  "dutch_auction",
  "charity_markets",
  "tournament",
]

[workspace.dependencies]
soroban-sdk = "=23.0.0"
backit-shared = { path = "shared" }
ed25519-dalek = ">=2.0.0, <3.0.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[patch.crates-io]
ed25519-dalek = { git = "https://github.com/dalek-cryptography/curve25519-dalek", tag = "ed25519-2.2.0" }

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
