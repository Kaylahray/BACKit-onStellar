[workspace]
resolver = "2"
members = [
  "shared",
  "call_registry",
  "outcome_manager",
  "prediction_market",
  "prediction_market_factory",
  "parlay_betting",
  "orderbook",
  "reputation_nft",
  "yield_aggregator",
  "contracts/hello-world",
]

[workspace.dependencies]
soroban-sdk = "23.0.0"
backit-shared = { path = "shared" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
